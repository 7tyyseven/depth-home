<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Beranda</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex/full.css">
<style>
:root{--h:265;--p:hsl(var(--h) 75% 80%);--op:hsl(var(--h) 50% 15%);--s:hsl(var(--h) 18% 12%/.78);--sv:hsl(var(--h) 14% 24%);--on:hsl(var(--h) 20% 93%);
--ui:'Google Sans Flex Variable','Google Sans Flex',system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:hsl(var(--h) 15% 8%);color:var(--on);font:400 15px var(--ui)}
#w,#c{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#w{z-index:0}#c{z-index:2}img[hidden]{display:none}
#clock{position:fixed;z-index:1;transform:translate(-50%,-50%);text-align:center;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
#clock:active{cursor:grabbing}#clock b{display:block;font-weight:inherit}#clock i{display:block;font-style:normal;font-size:.18em;line-height:1.2}
#d{font-size:.17em;line-height:1.3;letter-spacing:0}
.ui{position:fixed;z-index:3}
#q{left:50%;bottom:6vh;transform:translateX(-50%);width:min(640px,86vw);height:60px;border-radius:30px;background:var(--s);backdrop-filter:blur(24px) saturate(1.4);display:flex;align-items:center;padding:0 24px;gap:14px;transition:border-radius .35s cubic-bezier(.3,1.6,.5,1),height .3s}
#q:focus-within{border-radius:20px;height:66px}
#q input{flex:1;background:none;border:0;outline:0;color:var(--on);font:inherit;font-size:17px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#fab{right:28px;bottom:6vh;width:64px;height:64px;border:0;border-radius:50%;background:var(--p);color:var(--op);cursor:pointer;display:grid;place-items:center;transition:border-radius .4s cubic-bezier(.3,1.7,.5,1),transform .2s}
#fab:hover{border-radius:22px;transform:rotate(-8deg)}
#sh{top:16px;right:16px;bottom:16px;width:min(380px,92vw);background:var(--s);backdrop-filter:blur(30px) saturate(1.5);border-radius:32px;padding:22px;overflow:auto;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,1,.3,1)}
#sh.o{transform:none}
h3{font:600 17px var(--ui);margin:22px 0 10px}h3:first-child{margin-top:0}
.r{display:flex;align-items:center;gap:10px;margin:8px 0}.r label{flex:0 0 92px;font-size:13px;opacity:.8}.r input[type=range]{flex:1;accent-color:var(--p)}
.r output{flex:0 0 40px;text-align:right;font-size:12px;opacity:.7}
select,button.b{font:inherit;background:var(--sv);color:var(--on);border:0;border-radius:16px;padding:10px 14px;cursor:pointer}
select{flex:1}button.b:hover{background:hsl(var(--h) 14% 30%)}button.on{background:var(--p);color:var(--op)}
.g{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:76px;height:76px;border-radius:22px;background:var(--sv) center/cover;border:3px solid transparent;cursor:pointer;transition:border-radius .3s cubic-bezier(.3,1.7,.5,1)}
.th:hover{border-radius:32px}.th.on{border-color:var(--p)}.th u{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--op);color:var(--p);display:none;place-items:center;text-decoration:none;font-size:13px}
.th:hover u{display:grid}.add{display:grid;place-items:center;font-size:28px;background:var(--p);color:var(--op)}
#st{font-size:12px;opacity:.75;min-height:16px;margin-top:8px}
</style></head><body>
<img id="w" alt=""><div id="clock"><div id="d"></div><div id="t"></div></div><img id="c" alt="" hidden>
<form id="q" class="ui"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="qi" placeholder="Cari atau ketik alamat" autocomplete="off" autofocus></form>
<button id="fab" class="ui" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
<aside id="sh" class="ui">
<h3>Wallpaper</h3><div class="g" id="th"></div>
<div class="g" style="margin-top:10px"><button class="b" id="re">Proses ulang subjek</button><button class="b" id="im">Impor cutout PNG</button><button class="b" data-k="depth">Efek depth</button></div><div id="st"></div>
<h3>Jam</h3>
<div class="r"><label>Ukuran</label><input type="range" data-k="size" min="8" max="80" step=".5"><output></output></div>
<div class="r"><label>Font</label><select id="fs"></select><button class="b" id="uf">Font…</button></div>
<div id="ax"></div>
<div class="r"><label>Spasi huruf</label><input type="range" data-k="ls" min="-.1" max=".3" step=".005"><output></output></div>
<div class="r"><label>Tinggi baris</label><input type="range" data-k="lh" min=".6" max="1.3" step=".01"><output></output></div>
<div class="r"><label>Opasitas</label><input type="range" data-k="op" min=".1" max="1" step=".01"><output></output></div>
<div class="r"><label>Warna</label><input type="color" data-k="color"></div>
<div class="g"><button class="b" data-k="h24">24 jam</button><button class="b" data-k="sec">Detik</button><button class="b" data-k="stack">Bertumpuk</button><button class="b" data-k="date">Tanggal</button><button class="b" id="rp">Reset posisi</button></div>
</aside>
<input type="file" id="f1" accept="image/*" hidden><input type="file" id="f2" accept="image/png" hidden><input type="file" id="f3" accept=".ttf,.otf,.woff,.woff2" hidden>
<script type="module">
const TF="https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.0"; // naikkan versinya bila perlu
const SEARCH="https://www.google.com/search?q=";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const A=(w,m,x,d,s)=>({wght:[w,m,x],wdth:[25,151,100],opsz:[6,144,d],slnt:[-10,0,0],ROND:[0,100,0],GRAD:[0,100,0]});
const FONTS={
"Google Sans Flex":{pkg:"google-sans-flex",ax:{wght:[1,1000,500],wdth:[25,151,100],opsz:[6,144,144],ROND:[0,100,0],GRAD:[0,100,0],slnt:[-10,0,0]}},
"Roboto Flex":{pkg:"roboto-flex",ax:{wght:[100,1000,500],wdth:[25,151,100],opsz:[8,144,144],GRAD:[-200,150,0],slnt:[-10,0,0]}},
"Fraunces":{pkg:"fraunces",ax:{wght:[100,900,400],opsz:[9,144,144],SOFT:[0,100,50],WONK:[0,1,0]}},
"Bricolage Grotesque":{pkg:"bricolage-grotesque",ax:{wght:[200,800,600],wdth:[75,100,100],opsz:[12,96,96]}},
"Recursive":{pkg:"recursive",ax:{wght:[300,1000,600],slnt:[-15,0,0],CASL:[0,1,0],MONO:[0,1,0]}},
"Anybody":{pkg:"anybody",ax:{wght:[100,900,600],wdth:[50,150,100]}}};
const GEN={wght:[1,1000,500],wdth:[25,200,100],slnt:[-20,20,0],opsz:[6,144,100]};
const D={wp:null,font:"Google Sans Flex",ax:{},size:34,color:"#ffffff",op:.95,h24:true,sec:false,stack:true,date:true,depth:true,ls:0,lh:.85};
// ---------- storage (IndexedDB) ----------
const DB=new Promise((ok,no)=>{const r=indexedDB.open("depthhome",1);r.onupgradeneeded=()=>{r.result.createObjectStore("wp",{keyPath:"id"});r.result.createObjectStore("kv")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const T=async(s,m,f)=>{const db=await DB;return new Promise((ok,no)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const kvGet=k=>T("kv","readonly",s=>s.get(k)),kvSet=(k,v)=>T("kv","readwrite",s=>s.put(v,k));
let cfg={...D},wps=[],cur=null,U={},tm;
const save=()=>{clearTimeout(tm);tm=setTimeout(()=>kvSet("cfg",cfg).catch(console.error),250)};
const st=t=>$("#st").textContent=t;
// ---------- fonts ----------
function loadFont(n){const f=FONTS[n];if(!f||!f.pkg||f.done)return;f.done=1;const l=document.createElement("link");l.rel="stylesheet";l.href=`https://cdn.jsdelivr.net/npm/@fontsource-variable/${f.pkg}/full.css`;document.head.append(l)}
function fvar(buf){const d=new DataView(buf);if(d.getUint32(0)===0x774f4632)return null;const n=d.getUint16(4);
for(let i=0;i<n;i++){const o=12+i*16;if(d.getUint32(o)===0x66766172){const t=d.getUint32(o+8),off=d.getUint16(t+4),c=d.getUint16(t+8),z=d.getUint16(t+10),r={};
for(let k=0;k<c;k++){const a=t+off+k*z,tag=String.fromCharCode(d.getUint8(a),d.getUint8(a+1),d.getUint8(a+2),d.getUint8(a+3));r[tag]=[d.getInt32(a+4)/65536,d.getInt32(a+12)/65536,d.getInt32(a+8)/65536]}return r}}return null}
async function useCustom(blob,name){const buf=await blob.arrayBuffer(),ff=new FontFace("DHCustom",buf,{weight:"1 1000",stretch:"25% 200%"});await ff.load();document.fonts.add(ff);
FONTS.Custom={fam:"DHCustom",label:name,ax:fvar(buf)||GEN}}
function fillFonts(){$("#fs").innerHTML=Object.keys(FONTS).map(n=>`<option value="${n}">${FONTS[n].label||n}</option>`).join("");$("#fs").value=cfg.font}
function axes(){const f=FONTS[cfg.font]||FONTS["Google Sans Flex"],a=cfg.ax[cfg.font]=cfg.ax[cfg.font]||{};
$("#ax").innerHTML="";for(const[t,[mn,mx,df]]of Object.entries(f.ax)){const v=a[t]??df,r=document.createElement("div");r.className="r";
r.innerHTML=`<label>${t}</label><input type="range" min="${mn}" max="${mx}" step="${(mx-mn)>10?1:.01}" value="${v}"><output>${v}</output>`;
r.querySelector("input").oninput=e=>{a[t]=+e.target.value;r.querySelector("output").textContent=e.target.value;clock();save()};$("#ax").append(r)}}
// ---------- clock ----------
function clock(){const f=FONTS[cfg.font]||FONTS["Google Sans Flex"],a=cfg.ax[cfg.font]||{},c=$("#clock"),s=c.style;
s.fontFamily=`${f.fam||cfg.font+" Variable"},${"var(--ui)"}`;s.fontVariationSettings=Object.entries(f.ax).map(([t,[,,d]])=>`'${t}' ${a[t]??d}`).join(",");
s.fontSize=cfg.size+"vh";s.color=cfg.color;s.opacity=cfg.op;s.letterSpacing=cfg.ls+"em";s.lineHeight=cfg.lh;
if(cur){s.left=cur.x+"%";s.top=cur.y+"%"}tick()}
function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");let h=d.getHours();if(!cfg.h24)h=h%12||12;
const H=cfg.h24?p(h):h,M=p(d.getMinutes());$("#t").innerHTML=(cfg.stack?`<b>${H}</b><b>${M}</b>`:`<b>${H}:${M}</b>`)+(cfg.sec?`<i>${p(d.getSeconds())}</i>`:"");
$("#d").textContent=cfg.date?d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"}):""}
setInterval(tick,1000);
// ---------- wallpapers ----------
const mk=w=>{const o=U[w.id]||{};o.w&&URL.revokeObjectURL(o.w);o.c&&URL.revokeObjectURL(o.c);U[w.id]={w:URL.createObjectURL(w.blob),c:w.cut?URL.createObjectURL(w.cut):null}};
function show(){cur=wps.find(w=>w.id===cfg.wp)||wps[0]||null;const w=$("#w"),c=$("#c");
if(cur){cfg.wp=cur.id;w.src=U[cur.id].w;w.hidden=false;const u=U[cur.id].c;c.hidden=!(u&&cfg.depth);if(u)c.src=u;document.documentElement.style.setProperty("--h",cur.hue)}else{w.hidden=c.hidden=true}
$$("[data-k=depth]").forEach(b=>b.classList.toggle("on",cfg.depth));thumbs();clock()}
function thumbs(){const g=$("#th");g.innerHTML="";for(const w of wps){const e=document.createElement("div");e.className="th"+(w===cur?" on":"");e.style.backgroundImage=`url(${U[w.id].w})`;
e.onclick=()=>{cfg.wp=w.id;save();show()};const x=document.createElement("u");x.textContent="×";x.onclick=async ev=>{ev.stopPropagation();await T("wp","readwrite",s=>s.delete(w.id));wps=wps.filter(q=>q!==w);if(cfg.wp===w.id)cfg.wp=null;save();show()};e.append(x);g.append(e)}
const a=document.createElement("div");a.className="th add";a.textContent="+";a.onclick=()=>$("#f1").click();g.append(a)}
async function fit(file){const b=await createImageBitmap(file),k=Math.min(1,2560/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.92))}
async function hue(blob){const b=await createImageBitmap(blob),c=document.createElement("canvas");c.width=c.height=8;const g=c.getContext("2d");g.drawImage(b,0,0,8,8);const d=g.getImageData(0,0,8,8).data;let r=0,gg=0,bb=0;
for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];bb+=d[i+2]}r/=64;gg/=64;bb/=64;const mx=Math.max(r,gg,bb),mn=Math.min(r,gg,bb);if(mx===mn)return 265;
const dl=mx-mn,h=mx===r?((gg-bb)/dl)%6:mx===gg?(bb-r)/dl+2:(r-gg)/dl+4;return Math.round((h*60+360)%360)}
async function addWp(file){const blob=await fit(file),w={id:Date.now(),blob,cut:null,x:50,y:36,hue:await hue(blob)};await T("wp","readwrite",s=>s.put(w));wps.push(w);mk(w);cfg.wp=w.id;save();show();await segment(w)}
async function setCut(w,blob){w.cut=blob;await T("wp","readwrite",s=>s.put(w));mk(w);show()}
// ---------- subject segmentation (RMBG-1.4 via Transformers.js, lokal di browser) ----------
let M;
async function model(){if(M)return M;const{AutoModel,AutoProcessor,RawImage,env}=await import(TF);env.backends.onnx.wasm.proxy=false;const cf={model_type:"custom"};let m;
if(navigator.gpu){try{m=await AutoModel.from_pretrained("briaai/RMBG-1.4",{config:cf,device:"webgpu",dtype:"fp32"})}catch(e){console.warn("WebGPU gagal, pakai WASM",e)}}
m=m||await AutoModel.from_pretrained("briaai/RMBG-1.4",{config:cf,device:"wasm",dtype:"q8"});
const p=await AutoProcessor.from_pretrained("briaai/RMBG-1.4",{config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[.5,.5,.5],feature_extractor_type:"ImageFeatureExtractor",image_std:[1,1,1],resample:2,rescale_factor:1/255,size:{width:1024,height:1024}}});
return M={m,p,RawImage}}
async function segment(w){st("Memisahkan subjek… pertama kali perlu mengunduh model (sekali saja).");
try{const{m,p,RawImage}=await model(),u=URL.createObjectURL(w.blob),img=await RawImage.fromURL(u);URL.revokeObjectURL(u);
const{pixel_values}=await p(img),{output}=await m({input:pixel_values}),mask=await RawImage.fromTensor(output[0].mul(255).to("uint8")).resize(img.width,img.height);
const bm=await createImageBitmap(w.blob),c=document.createElement("canvas");c.width=bm.width;c.height=bm.height;const g=c.getContext("2d");g.drawImage(bm,0,0);
const id=g.getImageData(0,0,c.width,c.height);for(let i=0;i<mask.data.length&&i*4<id.data.length;i++)id.data[i*4+3]=mask.data[i];g.putImageData(id,0,0);
await setCut(w,await new Promise(r=>c.toBlob(r,"image/png")));st("Subjek terpisah ✓")}
catch(e){console.error(e);st("Gagal memisahkan subjek: "+(e.message||e)+". Coba 'Impor cutout PNG'.")}}
// ---------- wiring ----------
$("#fab").onclick=()=>$("#sh").classList.toggle("o");
addEventListener("keydown",e=>{if(e.key==="Escape")$("#sh").classList.remove("o")});
$("#f1").onchange=e=>{const f=e.target.files[0];e.target.value="";f&&addWp(f)};
$("#f2").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f&&cur){await setCut(cur,f);st("Cutout diimpor ✓")}};
$("#f3").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{await useCustom(f,f.name);await kvSet("font",{blob:f,name:f.name});cfg.font="Custom";fillFonts();axes();clock();save()}catch(x){st("Font gagal dimuat: "+x.message)}};
$("#re").onclick=()=>cur&&segment(cur);$("#im").onclick=()=>cur&&$("#f2").click();$("#uf").onclick=()=>$("#f3").click();
$("#rp").onclick=()=>{if(cur){cur.x=50;cur.y=36;T("wp","readwrite",s=>s.put(cur));clock()}};
$("#fs").onchange=e=>{cfg.font=e.target.value;loadFont(cfg.font);axes();clock();save()};
$$("input[data-k]").forEach(i=>i.oninput=()=>{cfg[i.dataset.k]=i.type==="range"?+i.value:i.value;const o=i.parentNode.querySelector("output");if(o)o.textContent=i.value;clock();save()});
$$("button[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;cfg[k]=!cfg[k];b.classList.toggle("on",cfg[k]);save();k==="depth"?show():clock()});
$("#q").onsubmit=e=>{e.preventDefault();const v=$("#qi").value.trim();if(!v)return;location.href=/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)||/^https?:\/\//.test(v)?(/^https?:/.test(v)?v:"https://"+v):SEARCH+encodeURIComponent(v)};
{const c=$("#clock");let s;c.onpointerdown=e=>{if(!cur)return;c.setPointerCapture(e.pointerId);s={x:e.clientX,y:e.clientY,ox:cur.x,oy:cur.y}};
c.onpointermove=e=>{if(!s)return;cur.x=Math.min(100,Math.max(0,s.ox+(e.clientX-s.x)/innerWidth*100));cur.y=Math.min(100,Math.max(0,s.oy+(e.clientY-s.y)/innerHeight*100));clock()};
c.onpointerup=()=>{if(s){s=null;T("wp","readwrite",x=>x.put(cur))}}}
// ---------- init ----------
try{cfg={...D,...(await kvGet("cfg"))};wps=await T("wp","readonly",s=>s.getAll());wps.forEach(mk);const cf=await kvGet("font");if(cf)await useCustom(cf.blob,cf.name)}catch(e){console.error(e)}
if(!FONTS[cfg.font])cfg.font="Google Sans Flex";Object.keys(FONTS).forEach(n=>FONTS[n].pkg&&(n===cfg.font||0)&&loadFont(n));
Object.keys(FONTS).forEach(n=>FONTS[n].pkg&&(FONTS[n].fam=n+" Variable"));
fillFonts();$$("input[data-k]").forEach(i=>{i.value=cfg[i.dataset.k];const o=i.parentNode.querySelector("output");if(o)o.textContent=i.value});
$$("button[data-k]:not([data-k=depth])").forEach(b=>b.classList.toggle("on",cfg[b.dataset.k]));axes();show();
// pratinjau semua font di dropdown dimuat saat dipilih (loadFont), bukan di awal
</script></body></html>
